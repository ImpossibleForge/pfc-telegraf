# Example Telegraf configuration for pfc-telegraf
# Add this to your telegraf.conf to forward metrics to pfc-telegraf.

# ── Option A: InfluxDB Line Protocol (recommended) ────────────────────────────
# Sends metrics in native InfluxDB line protocol — most efficient.

[[outputs.http]]
  url         = "http://localhost:8767/ingest"
  method      = "POST"
  data_format = "influx"
  timeout     = "10s"

  # Optional: authentication
  # [outputs.http.headers]
  #   "x-api-key" = "your-api-key"


# ── Option B: Telegraf JSON format ────────────────────────────────────────────
# Sends metrics as Telegraf JSON — also supported.

# [[outputs.http]]
#   url         = "http://localhost:8767/ingest"
#   method      = "POST"
#   data_format = "json"
#   timeout     = "10s"


# ── Example inputs to pair with pfc-telegraf ──────────────────────────────────

[[inputs.cpu]]
  percpu          = false
  totalcpu        = true
  collect_cpu_time = false

[[inputs.mem]]

[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "iso9660", "overlay", "aufs", "squashfs"]

[[inputs.net]]
  interfaces = ["eth*", "en*"]
