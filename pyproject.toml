[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name            = "pfc-telegraf"
version         = "0.1.0"
description     = "Telegraf output plugin — receives metrics via HTTP and compresses to PFC format"
readme          = "README.md"
license         = { text = "MIT" }
requires-python = ">=3.11"
keywords        = ["telegraf", "pfc", "compression", "metrics", "logs", "s3", "observability"]
classifiers     = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Logging",
    "Topic :: System :: Monitoring",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "toml>=0.10",
]

[project.scripts]
pfc-telegraf = "pfc_telegraf:main"

[project.urls]
Homepage   = "https://github.com/ImpossibleForge/pfc-telegraf"
Repository = "https://github.com/ImpossibleForge/pfc-telegraf"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]
